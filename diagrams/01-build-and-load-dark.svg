<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img"
     aria-label="El código de job-match-agent se buildea en una imagen dentro del Docker del host. Como kind corre su propio Docker aislado, esa imagen no existe ahí hasta que kind load docker-image la copia manualmente a los tres nodos del clúster.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
             markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dceaf5"></path>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5"
             markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a5b"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="300" fill="#0d1b2e"></rect>

  <!-- repo -->
  <rect x="20" y="110" width="150" height="64" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.4"></rect>
  <line x1="20" y1="122" x2="170" y2="122" stroke="#dceaf5" stroke-width="1"></line>
  <text x="30" y="118" font-size="11" fill="#dceaf5" font-family="ui-monospace, Menlo, monospace">job-match-agent/</text>
  <text x="30" y="145" font-size="11" fill="#dceaf5" opacity="0.75" font-family="ui-monospace, Menlo, monospace">Dockerfile</text>
  <text x="30" y="161" font-size="11" fill="#dceaf5" opacity="0.75" font-family="ui-monospace, Menlo, monospace">src/, data/</text>

  <!-- build arrow -->
  <line x1="170" y1="142" x2="278" y2="142" stroke="#dceaf5" stroke-width="1.4" marker-end="url(#arrow)"></line>
  <text x="176" y="132" font-size="10.5" fill="#dceaf5" opacity="0.85" font-family="ui-monospace, Menlo, monospace">docker build -t job-match-agent:local .</text>

  <!-- host docker box -->
  <rect x="286" y="70" width="190" height="180" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.4"></rect>
  <text x="296" y="90" font-size="11" fill="#dceaf5" opacity="0.8" font-family="ui-monospace, Menlo, monospace">Docker del host</text>
  <rect x="316" y="160" width="130" height="40" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.2"></rect>
  <text x="381" y="184" font-size="10.5" fill="#dceaf5" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, monospace">job-match-agent:local</text>

  <!-- boundary -->
  <line x1="512" y1="30" x2="512" y2="270" stroke="#dceaf5" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"></line>
  <text x="512" y="20" font-size="9.5" fill="#dceaf5" text-anchor="middle" opacity="0.6" letter-spacing="0.06em" font-family="ui-monospace, Menlo, monospace">DOS DAEMONS DE DOCKER AISLADOS</text>

  <!-- load arrow, accent -->
  <line x1="476" y1="180" x2="560" y2="180" stroke="#e08a5b" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="480" y="168" font-size="10.5" fill="#e08a5b" font-weight="600" font-family="ui-monospace, Menlo, monospace">kind load docker-image</text>

  <!-- kind cluster region -->
  <rect x="560" y="30" width="340" height="240" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.4"></rect>
  <text x="570" y="50" font-size="11" fill="#dceaf5" opacity="0.8" font-family="ui-monospace, Menlo, monospace">clúster kind — 3 nodos</text>

  <!-- 3 node boxes -->
  <rect x="578" y="70" width="90" height="56" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.2" opacity="0.7"></rect>
  <text x="623" y="94" font-size="9.5" fill="#dceaf5" text-anchor="middle" opacity="0.75" font-family="ui-monospace, Menlo, monospace">control-</text>
  <text x="623" y="106" font-size="9.5" fill="#dceaf5" text-anchor="middle" opacity="0.75" font-family="ui-monospace, Menlo, monospace">plane</text>

  <rect x="686" y="70" width="90" height="56" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.2"></rect>
  <text x="731" y="103" font-size="9.5" fill="#dceaf5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">worker</text>

  <rect x="794" y="70" width="90" height="56" rx="2" fill="none" stroke="#dceaf5" stroke-width="1.2"></rect>
  <text x="839" y="103" font-size="9.5" fill="#dceaf5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">worker2</text>

  <!-- copies landing -->
  <rect x="582" y="150" width="82" height="28" rx="2" fill="#3a2a22" stroke="#e08a5b" stroke-width="1"></rect>
  <text x="623" y="168" font-size="9" fill="#e08a5b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">imagen copiada</text>
  <rect x="690" y="150" width="82" height="28" rx="2" fill="#3a2a22" stroke="#e08a5b" stroke-width="1"></rect>
  <text x="731" y="168" font-size="9" fill="#e08a5b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">imagen copiada</text>
  <rect x="798" y="150" width="82" height="28" rx="2" fill="#3a2a22" stroke="#e08a5b" stroke-width="1"></rect>
  <text x="839" y="168" font-size="9" fill="#e08a5b" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">imagen copiada</text>

  <text x="730" y="230" font-size="9.5" fill="#dceaf5" text-anchor="middle" opacity="0.6" font-family="ui-monospace, Menlo, monospace">
    sin este paso: "ImagePullBackOff" — el clúster nunca vio la imagen
  </text>
</svg>
