apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-match-agent
  namespace: job-match-agent
  labels:
    app: job-match-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-match-agent
  template:
    metadata:
      labels:
        app: job-match-agent
    spec:
      containers:
        - name: job-match-agent
          image: job-match-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: job-match-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
